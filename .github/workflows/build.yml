name: Packages build

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup build environment
      uses: ./.github/actions/setup-build
    - name: Build and publish macOS arm64 package
      run: node_modules/.bin/electron-builder build --mac --arm64 --publish always
      env:
        GH_TOKEN: ${{ secrets.github_token }}
